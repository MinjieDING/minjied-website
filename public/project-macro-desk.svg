      .label { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #ECF2F8; }
      .small { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #A5B6C9; }
      .chip { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #052331; }
      .metric { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #DCEAF6; }
