      <stop stop-color="#08192B"/>
      <stop offset="1" stop-color="#0E2942"/>
    </linearGradient>
    <linearGradient id="panel" x1="120" y1="120" x2="1080" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E2438"/>
      <stop offset="1" stop-color="#0A1B2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="181" x2="950" y2="181" gradientUnits="userSpaceOnUse">
